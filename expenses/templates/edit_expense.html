{% extends 'base.html' %}


{% block title %}
Edit Expense
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Edit Expense</h1>


    <form method="POST">

        {% csrf_token %}


        <label>
            Expense Title
        </label>

        <input type="text" name="title" value="{{ expense.title }}" required>


        <label>
            Amount
        </label>

        <input type="number" name="amount" value="{{ expense.amount }}" step="0.01" required>


        <label>
            Category
        </label>

        <select name="category" required>

            <option value="Food">
                Food
            </option>

            <option value="Transport">
                Transport
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Entertainment">
                Entertainment
            </option>

            <option value="Bills">
                Bills
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>
            Date
        </label>

        <input type="date" name="date" value="{{ expense.date|date:'Y-m-d' }}" required>


        <label>
            Description
        </label>

        <textarea name="description">{{ expense.description }}</textarea>


        <button type="submit">
            Update Expense
        </button>

    </form>

</div>

{% endblock %}
